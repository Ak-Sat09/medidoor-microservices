<!DOCTYPE html>
<html>

<head>
    <title>Auto Payment STOMP</title>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>

<body>
    <h1>Auto Payment Page with STOMP</h1>

    <script>
        var socket = new SockJS('http://localhost:8082/ws-payments');
        var stompClient = Stomp.over(socket);

        stompClient.connect({}, function (frame) {
            console.log("Connected:", frame);
            stompClient.subscribe('/topic/payments', function (message) {
                const data = JSON.parse(message.body);
                console.log("Payment order received via STOMP:", data);

                // Open Razorpay Checkout automatically
                const options = {
                    key: data.key,
                    amount: data.amount,
                    currency: data.currency,
                    order_id: data.orderId,
                    name: "Test Payment",
                    prefill: { email: data.userEmail },
                    handler: function (res) {
                        alert("Payment Success! PaymentId: " + res.razorpay_payment_id);

                        // Call backend to verify payment
                        fetch("http://localhost:8082/api/payments/verify?orderId=" + data.orderId +
                            "&paymentId=" + res.razorpay_payment_id + "&signature=" + res.razorpay_signature,
                            { method: "POST" });
                    },
                    theme: { color: "#528FF0" }
                };
                const rzp = new Razorpay(options);
                rzp.open();
            });
        });
    </script>
</body>

</html>
